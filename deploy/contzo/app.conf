# deploy/contzo/app.conf: how deploy.sh ships edgy to the WSL host.
# Sourced by bash, so it is shell syntax: no spaces around '=', quote values.
# Committed to git; never put secrets here (they belong in ~/apps/edgy/shared/.env).

APP_NAME="edgy"                   # ~/apps/edgy, unit name, Caddy site file name
SUBDOMAIN="edgy"                  # -> https://edgy.contzo.lol
KIND="service"

# ---- service ---------------------------------------------------------------
PORT=7714                        # the app binds 127.0.0.1:$PORT
HEALTH_PATH="/api/health"
# edgy reads EDGY_PORT, not PORT; the server runs in-process under tsx (it's how `npm start` runs it too).
PROCESSES=(
  'web|env EDGY_PORT=$PORT node --disable-warning=ExperimentalWarning --import tsx src/server/index.ts'
)
SSE=1                             # live changes stream as text/event-stream
MAX_BODY="20MiB"                  # edgy caps request bodies at 16 MiB itself
SHARED_DIRS=("data")              # data/edgy.db (SQLite, WAL) and data/assets (uploaded pictures)

BACKUP="sqlite:data/edgy.db"      # nightly, newest 14 kept; data/assets is not in it
SYNC_EXCLUDES=("/dist/" "/site/.gen/" "*.log")

# tsx is a devDependency and runs the server, so devDependencies stay (no node_prune).

app_env() {           # the first shared/.env (never rewritten later)
  echo "EDGY_AUTH=accounts"
  echo "EDGY_WEB_URL=https://edgy.contzo.lol"
  echo "# After you've made your own account (the first one owns the server), set this to off:"
  echo "EDGY_SIGNUPS=on"
  echo "# Optional: Claude for Ask AI, in the owner's documents"
  echo "# ANTHROPIC_API_KEY="
}
